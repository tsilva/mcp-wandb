name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.13"
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked --exclude-newer '7 days'

      - name: Check formatting and lint
        run: |
          uv run --locked --exclude-newer '7 days' ruff format --check .
          uv run --locked --exclude-newer '7 days' ruff check .

      - name: Run offline tests
        run: uv run --locked --exclude-newer '7 days' pytest -q

      - name: Audit locked dependencies
        run: >-
          uv audit --locked --exclude-newer '7 days'
          --python-platform x86_64-manylinux_2_28
