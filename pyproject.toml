[project]
name = "mcp-wandb"
version = "0.1.0"
description = "A simple server for MCP that uses Weights & Biases (wandb) for logging and visualization."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.10.3",
    "mcp[cli]>=2.0.0,<3",
    "python-dotenv>=1.2.2",
    "wandb>=0.20.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
